# PromptBrick Static Site Configuration for Jekyll
title: "prompt-brick-service - Modular Prompt Repository"
description: "Composable Lego-style prompt brick library deployed via GitHub Pages"
baseurl: "" # the subpath of your site, e.g. /prompt-repo
url: "https://pages.github.io" # the base hostname & protocol

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: "prompts"
    values:
      layout: "prompt"
      prompt_kind: "brick"
      render_with_liquid: false
  - scope:
      path: "prompt-store"
    values:
      prompt_kind: "complete"

exclude:
  - .github/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
