<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root {
      --pico-font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      --pico-font-size: 90%;
    }
    pre { background: #0f172a; color: #f8fafc; padding: 1.25rem; border-radius: 8px; overflow-x: auto; }
    .brick-meta { display: flex; gap: 1rem; color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 4px; background: #e2e8f0; font-size: 0.75rem; }
    nav { margin-bottom: 2rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 1rem; }
    main { font-size: 0.95rem; }
  </style>
</head>
<body>
  <main class="container">
    <nav>
      <ul>
        <li><strong>{{ site.title }}</strong></li>
      </ul>
      <ul>
        <li><a href="{{ site.baseurl }}/">Prompt Bricks</a></li>
        <li><a href="{{ site.baseurl }}/prompt-store/">Prompt Store</a></li>
        <li><a href="https://github.com/Jamesockenden/prompt-bricks" target="_blank">Git Repository</a></li>
      </ul>
    </nav>
    {{ content }}
  </main>
</body>
</html>
